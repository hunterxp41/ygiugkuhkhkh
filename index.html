<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <div class="score-board">
      <div class="score-item">
        <span class="label">Score</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-item">
        <span class="label">High Score</span>
        <span id="high-score" class="value">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="game-canvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Snake Game</h2>
        <p id="overlay-message">Press Start or use Arrow Keys</p>
        <button id="start-btn" class="btn">Start Game</button>
      </div>
    </div>

    <div class="controls">
      <button id="restart-btn" class="btn btn-secondary">Restart</button>
    </div>

    <p class="hint">Use <kbd>Arrow Keys</kbd> to move &middot; <kbd>R</kbd> to restart</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
